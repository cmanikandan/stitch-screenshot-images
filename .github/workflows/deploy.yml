name: CI & Deployment Packaging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-extension:
    name: Chrome Extension (Test & Package)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Extension Test Suite
        working-directory: chrome-extension
        run: npm test

      - name: Package Extension for Distribution
        working-directory: chrome-extension
        run: npm run package

      - name: Upload Extension Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pagestitch-chrome-extension
          path: dist/pagestitch-chrome-extension-*.zip
          retention-days: 30

  ios-app:
    name: iOS App & Share Extension (Xcode Build & Test)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Run iOS Unit Tests
        run: |
          xcodebuild test \
            -project ios-app/StitchScreenshot/StitchScreenshot.xcodeproj \
            -scheme StitchScreenshot \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build Generic iOS Release Target
        run: |
          xcodebuild build \
            -project ios-app/StitchScreenshot/StitchScreenshot.xcodeproj \
            -scheme StitchScreenshot \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
